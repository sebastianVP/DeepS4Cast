<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepS4Cast | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🛰️ DeepS4Cast - Lima, Perú</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Controles</h5>
                        <p class="small text-muted">Configuración del pronóstico Bi-LSTM</p>
                        <hr>
                        <button class="btn btn-primary w-100 mb-2">🔄 Actualizar Datos</button>
                        <button class="btn btn-outline-success w-100">📥 Exportar CSV</button>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card shadow-sm">
                    <div class="card-body">
                        {{ plot_div|safe }}
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
